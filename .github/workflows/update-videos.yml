name: 動画データを更新
on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 朝6時（日本時間）
    - cron: "0 6 * * *"    # 毎日 午後3時（日本時間）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 新着動画を集める
        run: python3 gen_videos.py
      - name: 変更があれば保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.js
          git diff --cached --quiet || (git commit -m "動画データを更新" && git push)
