<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>kidstube</title>
<style>
  :root { --bg:#fff; --bg2:#f2f2f2; --hover:#e5e5e5; --ink:#0f0f0f; --sub:#606060; --line:#e5e5e5; --accent:#ff0033; --chip:#f2f2f2; --chip-on:#0f0f0f; --chip-on-ink:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f0f0f; --bg2:#272727; --hover:#3f3f3f; --ink:#f1f1f1; --sub:#aaa; --line:#303030; --chip:#272727; --chip-on:#f1f1f1; --chip-on-ink:#0f0f0f; }
  }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Sans","Roboto","Yu Gothic UI",sans-serif; font-size:14px; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; cursor:pointer; }
  /* ヘッダー */
  header { position:fixed; inset:0 0 auto 0; height:56px; z-index:20; background:var(--bg); display:flex; align-items:center; gap:12px; padding:0 16px; }
  .icon-btn { width:40px; height:40px; border:0; border-radius:50%; background:none; display:grid; place-items:center; flex:none; }
  .icon-btn:hover { background:var(--bg2); }
  .logo { display:flex; align-items:center; gap:6px; font-weight:700; font-size:18px; letter-spacing:-.5px; white-space:nowrap; }
  .logo i { width:30px; height:21px; border-radius:6px; background:var(--accent); display:grid; place-items:center; }
  .logo i::after { content:""; border-left:8px solid #fff; border-top:5px solid transparent; border-bottom:5px solid transparent; margin-left:2px; }
  form.search { flex:1; max-width:640px; margin:0 auto; display:flex; min-width:0; }
  form.search input { flex:1; min-width:0; height:40px; padding:0 16px; font:inherit; font-size:16px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-right:0; border-radius:20px 0 0 20px; outline:none; }
  form.search input:focus { border-color:#1c62b9; }
  form.search button { width:64px; height:40px; border:1px solid var(--line); border-radius:0 20px 20px 0; background:var(--bg2); display:grid; place-items:center; }
  /* サイドバー */
  nav { position:fixed; top:56px; bottom:0; left:0; width:232px; overflow-y:auto; padding:12px; background:var(--bg); z-index:10; }
  body.mini nav { display:none; }
  nav a { display:flex; align-items:center; gap:20px; height:40px; padding:0 12px; border-radius:10px; white-space:nowrap; overflow:hidden; }
  nav a:hover { background:var(--bg2); }
  nav a.on { background:var(--bg2); font-weight:600; }
  nav a span.e { width:24px; text-align:center; font-size:18px; flex:none; }
  nav h3 { font-size:15px; margin:10px 12px 4px; }
  nav hr { border:0; border-top:1px solid var(--line); margin:12px 0; }
  main { margin:56px 0 0 232px; padding:0 24px 60px; min-height:calc(100vh - 56px); }
  body.mini main, body.watching main { margin-left:0; }
  body.watching nav { display:none; }
  body.watching.open nav { display:block; box-shadow:0 0 40px rgba(0,0,0,.5); }
  /* チップ */
  .chips { position:sticky; top:56px; z-index:5; background:var(--bg); display:flex; gap:12px; padding:12px 0; overflow-x:auto; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; height:32px; padding:0 12px; border:0; border-radius:8px; background:var(--chip); font-weight:500; white-space:nowrap; }
  .chip:hover { background:var(--hover); }
  .chip.on { background:var(--chip-on); color:var(--chip-on-ink); }
  /* 動画カード */
  .grid { display:grid; gap:36px 16px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  .card { cursor:pointer; min-width:0; }
  .thumb { position:relative; aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:var(--bg2); }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .card:hover .thumb { border-radius:0; }
  .meta { display:flex; gap:12px; margin-top:12px; }
  .ava { width:36px; height:36px; border-radius:50%; object-fit:cover; flex:none; background:var(--bg2); }
  .t { font-size:16px; font-weight:500; line-height:22px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; overflow-wrap:anywhere; }
  .s { color:var(--sub); margin-top:4px; line-height:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .s a:hover { color:var(--ink); }
  h2.sec { font-size:20px; margin:24px 0 16px; display:flex; align-items:center; gap:8px; }
  .shorts { display:grid; gap:20px 8px; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); }
  .shorts.row { grid-auto-flow:column; grid-auto-columns:minmax(180px,1fr); grid-template-columns:none; grid-template-rows:1fr; overflow:hidden; }
  .shorts .thumb { aspect-ratio:9/16; }
  .shorts .t { font-size:15px; margin-top:8px; }
  .more { display:block; margin:28px auto 0; height:36px; padding:0 16px; border:1px solid var(--line); border-radius:18px; background:none; font-weight:500; }
  .more:hover { background:var(--bg2); }
  .empty { color:var(--sub); text-align:center; padding:80px 0; }
  /* 視聴ページ */
  .watch { display:grid; grid-template-columns:minmax(0,1fr) 402px; gap:24px; max-width:1754px; margin:0 auto; padding-top:24px; }
  @media (max-width:1000px) { .watch { grid-template-columns:1fr; } }
  .player { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; max-height:calc(100vh - 56px - 150px); margin:0 auto; }
  .player.short { aspect-ratio:9/16; max-width:calc((100vh - 56px - 150px) * 9 / 16); }
  .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .watch h1 { font-size:20px; line-height:28px; margin:12px 0 0; overflow-wrap:anywhere; }
  .owner { display:flex; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap; }
  .owner .ava { width:40px; height:40px; }
  .owner .n { font-size:16px; font-weight:500; }
  .pill { height:36px; padding:0 16px; border:0; border-radius:18px; background:var(--chip-on); color:var(--chip-on-ink); font-weight:500; white-space:nowrap; }
  .pill.off { background:var(--bg2); color:var(--ink); }
  .pill.off:hover { background:var(--hover); }
  .desc { margin-top:12px; padding:12px; border-radius:12px; background:var(--bg2); font-weight:500; }
  .side .card { display:flex; gap:8px; margin-bottom:8px; }
  .side .thumb { width:168px; flex:none; border-radius:8px; }
  .side .t { font-size:14px; line-height:20px; font-weight:500; }
  .side .s { font-size:12px; margin-top:2px; line-height:18px; }
  .side .meta { margin:0; display:block; min-width:0; }
  /* チャンネル・検索 */
  .chead { display:flex; align-items:center; gap:24px; padding:24px 0 8px; flex-wrap:wrap; }
  .chead .ava { width:120px; height:120px; }
  .chead h1 { font-size:32px; margin:0 0 4px; overflow-wrap:anywhere; }
  .chrow { display:grid; gap:16px 8px; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); margin-bottom:8px; }
  .chrow a { text-align:center; padding:12px 6px; border-radius:12px; min-width:0; }
  .chrow a:hover { background:var(--bg2); }
  .chrow .ava { width:88px; height:88px; margin:0 auto 8px; display:block; }
  .chrow .t { font-size:14px; line-height:20px; }
  @media (max-width:800px) { nav { display:none; } body.open nav { display:block; box-shadow:0 0 40px rgba(0,0,0,.5); } main { margin-left:0; padding:0 12px 60px; } .logo b { display:none; } }
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="menu" aria-label="メニュー"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v1.5H3zm0 5.25h18v1.5H3zm0 5.25h18V18H3z"/></svg></button>
  <a class="logo" href="#/"><i></i><b>kidstube</b></a>
  <form class="search" id="search" role="search">
    <input id="q" type="search" placeholder="検索" aria-label="検索" autocomplete="off">
    <button aria-label="検索"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg></button>
  </form>
</header>
<nav id="nav"></nav>
<main id="main"><p class="empty">よみこみ中…</p></main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("dh_" + k) || "[]"); } catch (e) { return []; } },
  set(k, v) { try { localStorage.setItem("dh_" + k, JSON.stringify(v)); } catch (e) {} },
};
let CH = [], chById = {}, V = [], vById = {}, byCh = {}, GENRES = [];
const PAGE = 48;

function load(file) {
  return new Promise(res => { const s = el("script"); s.src = file + "?t=" + Date.now(); s.onload = s.onerror = res; document.body.appendChild(s); });
}
function prepare() {
  CH = (window.CHANNELS || []).filter(c => /^UC[\w-]{22}$/.test(c.id));
  CH.forEach(c => chById[c.id] = c);
  const used = new Set(CH.map(c => c.genre));
  GENRES = (window.GENRES || []).filter(g => used.has(g));
  const ids = window.VIDEO_CH || [];
  (window.VIDEOS || []).forEach(a => {
    const ch = chById[ids[a[2]]];
    if (!ch) return;                      // 許可リストから外したチャンネルの動画は出さない
    const v = { id: a[0], title: a[1], ch, at: a[3], short: !!a[4], views: a[5] };
    V.push(v); vById[v.id] = v; (byCh[ch.id] = byCh[ch.id] || []).push(v);
  });
}
// 表示用
function ago(ts) {
  const d = (Date.now() / 1000 - ts) / 86400;
  if (d < 1) return Math.max(1, Math.floor(d * 24)) + " 時間前";
  if (d < 7) return Math.floor(d) + " 日前";
  if (d < 31) return Math.floor(d / 7) + " 週間前";
  if (d < 365) return Math.floor(d / 30.4) + " か月前";
  return Math.floor(d / 365) + " 年前";
}
function views(n) {
  if (!n) return "";
  if (n >= 1e8) return (n / 1e8).toFixed(n < 1e9 ? 1 : 0).replace(/\.0$/, "") + "億 回視聴";
  if (n >= 1e4) return (n >= 1e5 ? Math.round(n / 1e4) : (n / 1e4).toFixed(1).replace(/\.0$/, "")) + "万 回視聴";
  return n.toLocaleString() + " 回視聴";
}
const sub = v => [views(v.views), ago(v.at)].filter(Boolean).join("・");
function img(src, cls) { const i = el("img", cls); i.src = src; i.alt = ""; i.loading = "lazy"; i.referrerPolicy = "no-referrer"; return i; }
const thumbUrl = v => "https://i.ytimg.com/vi/" + v.id + "/" + (v.short ? "hq720" : "mqdefault") + ".jpg";
function thumb(v) {
  const t = el("div", "thumb"); const i = img(thumbUrl(v));
  i.onerror = () => { i.onerror = null; i.src = "https://i.ytimg.com/vi/" + v.id + "/hqdefault.jpg"; };
  t.append(i); return t;
}
function card(v, opt = {}) {
  const c = el("div", "card"); c.onclick = () => location.hash = "#/watch/" + v.id;
  const m = el("div", "meta"), b = el("div"); b.style.minWidth = 0;
  b.append(el("div", "t", v.title));
  if (!opt.short) {
    if (!opt.noCh) { const s = el("div", "s"), a = el("a", "", v.ch.name); a.href = "#/ch/" + v.ch.id; a.onclick = e => e.stopPropagation(); s.append(a); b.append(s); }
    b.append(el("div", "s", sub(v)));
    if (!opt.side && !opt.noCh) { const a = el("a"); a.href = "#/ch/" + v.ch.id; a.onclick = e => e.stopPropagation(); a.append(img(v.ch.avatar, "ava")); m.append(a); }
  } else b.append(el("div", "s", views(v.views) || ago(v.at)));
  m.append(b); c.append(thumb(v), m); c.title = v.title; return c;
}
// その日ごとに並びが変わる、新しい動画ほど上に来やすいシャッフル
function mix(list, salt) {
  let s = Math.floor(Date.now() / 3.6e6 / 6) * 131 + (salt || 0) + 7;
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const now = Date.now() / 1000;
  return list.map(v => [rnd() / (1 + (now - v.at) / 86400 / 20), v]).sort((a, b) => b[0] - a[0]).map(x => x[1]);
}
function pager(box, list, make) {
  let n = 0; const more = el("button", "more", "もっと見る");
  const add = () => { box.append(...list.slice(n, n + PAGE).map(make)); n += PAGE; if (n >= list.length) more.remove(); };
  more.onclick = add; add();
  const io = new IntersectionObserver(es => { if (es[0].isIntersecting && document.contains(more)) add(); }, { rootMargin: "800px" });
  if (n < list.length) io.observe(more);
  return n < list.length ? more : null;
}
function videoGrid(list, opt) { const g = el("div", "grid"); const m = pager(g, list, v => card(v, opt)); const f = document.createDocumentFragment(); f.append(g); if (m) f.append(m); return f; }
function shortGrid(list) { const g = el("div", "shorts"); const m = pager(g, list, v => card(v, { short: true })); const f = document.createDocumentFragment(); f.append(g); if (m) f.append(m); return f; }
function chRow(list) {
  const r = el("div", "chrow");
  r.append(...list.map(c => { const a = el("a"); a.href = "#/ch/" + c.id; a.append(img(c.avatar, "ava"), el("div", "t", c.name)); a.title = c.name; return a; }));
  return r;
}
// 画面
function home(genre) {
  const m = $("main"); m.replaceChildren();
  const chips = el("div", "chips");
  ["すべて", ...GENRES].forEach(g => { const b = el("button", "chip" + ((genre || "すべて") === g ? " on" : ""), g); b.onclick = () => location.hash = g === "すべて" ? "#/" : "#/cat/" + encodeURIComponent(g); chips.append(b); });
  m.append(chips);
  const pool = genre ? V.filter(v => v.ch.genre === genre) : V;
  const longs = mix(pool.filter(v => !v.short), 1), shorts = mix(pool.filter(v => v.short), 2);
  if (!pool.length) {
    const cs = CH.filter(c => !genre || c.genre === genre);
    m.append(cs.length ? chRow(cs) : el("p", "empty", "動画がありません"));
    return;
  }
  const first = el("div", "grid"); first.append(...longs.slice(0, 8).map(v => card(v))); m.append(first);
  if (shorts.length) {
    const h = el("h2", "sec", "ショート"); const row = el("div", "shorts row");
    row.append(...shorts.slice(0, 12).map(v => card(v, { short: true }))); m.append(h, row);
    const sp = el("div"); sp.style.height = "32px"; m.append(sp);
  }
  if (!genre) {
    // あたらしく入ったチャンネル（追加から4週間）
    const fresh = CH.filter(c => c.added && Date.now() - Date.parse(c.added) < 28 * 864e5);
    if (fresh.length) m.append(el("h2", "sec", "あたらしく入ったチャンネル"), chRow(fresh.slice(0, 16)));
    // あたらしい出会い：まだ見たことのないチャンネルから、カテゴリをばらけさせて出す
    const meet = discover(longs, 8);
    if (meet.length) { const g = el("div", "grid"); g.append(...meet.map(v => card(v))); m.append(el("h2", "sec", "あたらしい出会い"), g); const sp = el("div"); sp.style.height = "36px"; m.append(sp); }
  }
  m.append(videoGrid(longs.slice(8)));
  if (genre) { m.append(el("h2", "sec", genre + " のチャンネル"), chRow(CH.filter(c => c.genre === genre))); }
}
// まだ見たことのないチャンネルの動画を、カテゴリが偏らないように n 本えらぶ
function discover(list, n, skipGenre) {
  const seen = new Set(store.get("seen")), usedCh = new Set(), byGenre = {};
  list.forEach(v => { if (seen.has(v.ch.id) || v.ch.genre === skipGenre || usedCh.has(v.ch.id)) return; usedCh.add(v.ch.id); (byGenre[v.ch.genre] = byGenre[v.ch.genre] || []).push(v); });
  const gs = mix(Object.keys(byGenre).map((g, i) => ({ g, at: Date.now() / 1000 - i })), 5).map(x => x.g), out = [];
  for (let round = 0; out.length < n && round < 4; round++) for (const g of gs) { const v = byGenre[g][round]; if (v && out.length < n) out.push(v); }
  return out;
}
function shortsPage() { const m = $("main"); m.replaceChildren(el("h2", "sec", "ショート"), shortGrid(mix(V.filter(v => v.short), 3))); }
function related(v) {
  const same = (byCh[v.ch.id] || []).filter(x => x.id !== v.id && x.short === v.short).sort((a, b) => b.at - a.at);
  const genre = mix(V.filter(x => x.ch.id !== v.ch.id && x.ch.genre === v.ch.genre && x.short === v.short), v.at % 997);
  // 別のカテゴリの、まだ見たことのないチャンネルからも少し混ぜる（偶然の出会い用）
  const other = v.short ? [] : discover(mix(V.filter(x => !x.short), v.at % 991), 8, v.ch.genre);
  const out = []; let i = 0, j = 0, k = 0;                // 同じチャンネルと同じジャンルを交互に、5本に1本は別カテゴリ
  while (out.length < 46 && (i < same.length || j < genre.length)) {
    if (out.length % 5 === 4 && k < other.length) out.push(other[k++]);
    else if (i < same.length && (out.length % 3 !== 2 || j >= genre.length)) out.push(same[i++]);
    else if (j < genre.length) out.push(genre[j++]);
  }
  return out.concat(other.slice(k));
}
function favBtn(ch) {
  const b = el("button", "pill");
  const draw = () => { const on = store.get("fav").includes(ch.id); b.textContent = on ? "★ お気に入り" : "☆ お気に入りに入れる"; b.classList.toggle("off", on); };
  b.onclick = () => { const f = store.get("fav"); const i = f.indexOf(ch.id); i < 0 ? f.unshift(ch.id) : f.splice(i, 1); store.set("fav", f); draw(); nav(); };
  draw(); return b;
}
function playerFrame(src, short) {
  const p = el("div", "player" + (short ? " short" : "")), f = el("iframe");
  f.src = src; f.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture"; f.allowFullscreen = true;
  f.referrerPolicy = "strict-origin-when-cross-origin"; f.title = "動画プレーヤー"; p.append(f); return p;
}
function watch(id) {
  const v = vById[id], m = $("main");
  if (!v) { m.replaceChildren(el("p", "empty", "この動画は kidstube では見られません")); return; }
  const rel = related(v);
  store.set("hist", [v.id, ...store.get("hist").filter(x => x !== v.id)].slice(0, 200));
  if (!store.get("seen").includes(v.ch.id)) store.set("seen", [...store.get("seen"), v.ch.id]);
  // 見終わったら、関連動画の先頭から順に自動で次へ進む
  // （再生リストの先頭に今の動画を入れておかないと、関連動画の1本目から始まってしまう）
  const next = [v, ...rel.slice(0, 25)].map(x => x.id).join(",");
  const w = el("div", "watch"), L = el("div"), R = el("div", "side");
  L.append(playerFrame("https://www.youtube-nocookie.com/embed/" + v.id + "?autoplay=1&rel=0&playsinline=1" + (next ? "&playlist=" + next : ""), v.short), el("h1", "", v.title));
  const o = el("div", "owner"), a = el("a"); a.href = "#/ch/" + v.ch.id; a.append(img(v.ch.avatar, "ava"));
  const n = el("a", "n", v.ch.name); n.href = a.href;
  o.append(a, n, favBtn(v.ch)); L.append(o, el("div", "desc", sub(v)));
  R.append(...rel.map(x => card(x, { side: true })));
  w.append(L, R); m.replaceChildren(w);
}
function channel(id) {
  const c = chById[id], m = $("main");
  if (!c) { m.replaceChildren(el("p", "empty", "このチャンネルは kidstube にはありません")); return; }
  const vs = (byCh[id] || []).slice().sort((a, b) => b.at - a.at);
  const h = el("div", "chead"), b = el("div"), btns = el("div", "owner");
  const all = el("button", "pill off", "▶ ぜんぶの動画を見る");
  const holder = el("div");
  all.onclick = () => { holder.replaceChildren(playerFrame("https://www.youtube-nocookie.com/embed/videoseries?list=UU" + c.id.slice(2) + "&rel=0&autoplay=1"), el("p", "s", "ほかの動画は、プレーヤー右下の「その他の動画」からえらべます。")); holder.scrollIntoView({ block: "center" }); };
  btns.append(favBtn(c), all);
  b.append(el("h1", "", c.name), el("div", "s", c.genre), btns);
  h.append(img(c.avatar.replace("=s176-", "=s240-"), "ava"), b);
  m.replaceChildren(h, holder);
  const longs = vs.filter(v => !v.short), shorts = vs.filter(v => v.short);
  if (longs.length) m.append(el("h2", "sec", "動画"), videoGrid(longs, { noCh: true }));
  if (shorts.length) m.append(el("h2", "sec", "ショート"), shortGrid(shorts));
  if (!vs.length) all.click();
}
const norm = s => s.toLowerCase().normalize("NFKC").replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
function searchPage(q) {
  const m = $("main"); $("q").value = q;
  const ws = norm(q).split(/\s+/).filter(Boolean);
  if (!ws.length) { m.replaceChildren(el("p", "empty", "ことばを入れて検索してね")); return; }
  const hit = s => { const t = norm(s); return ws.every(w => t.includes(w)); };
  const cs = CH.filter(c => hit(c.name));
  const vs = V.filter(v => hit(v.title + " " + v.ch.name)).sort((a, b) => (b.views || 0) * 0 + b.at - a.at);
  m.replaceChildren();
  if (cs.length) m.append(el("h2", "sec", "チャンネル"), chRow(cs.slice(0, 24)));
  const longs = vs.filter(v => !v.short), shorts = vs.filter(v => v.short);
  if (longs.length) m.append(el("h2", "sec", "動画"), videoGrid(longs));
  if (shorts.length) m.append(el("h2", "sec", "ショート"), shortGrid(shorts));
  if (!cs.length && !vs.length) m.append(el("p", "empty", "「" + q + "」は見つかりませんでした"));
}
function favPage() {
  const cs = store.get("fav").map(i => chById[i]).filter(Boolean), m = $("main");
  if (!cs.length) { m.replaceChildren(el("p", "empty", "お気に入りのチャンネルはまだありません。チャンネルの「☆ お気に入りに入れる」を押すと、ここに並びます。")); return; }
  const set = new Set(cs.map(c => c.id));
  m.replaceChildren(el("h2", "sec", "お気に入りのチャンネル"), chRow(cs), el("h2", "sec", "お気に入りの新しい動画"), videoGrid(V.filter(v => set.has(v.ch.id) && !v.short).sort((a, b) => b.at - a.at)));
}
function histPage() {
  const vs = store.get("hist").map(i => vById[i]).filter(Boolean), m = $("main");
  m.replaceChildren(el("h2", "sec", "りれき"), vs.length ? videoGrid(vs) : el("p", "empty", "まだ見た動画がありません"));
}
function nav() {
  const r = location.hash, n = $("nav"); n.replaceChildren();
  const item = (emoji, label, href, ext) => { const a = el("a", r === href || (href === "#/" && (r === "" || r === "#")) ? "on" : ""); a.href = href; if (ext) { a.target = "_blank"; a.rel = "noopener"; } a.append(el("span", "e", emoji), document.createTextNode(label)); return a; };
  n.append(item("🏠", "ホーム", "#/"), item("⚡", "ショート", "#/shorts"), item("★", "お気に入り", "#/fav"), item("🕘", "りれき", "#/history"), el("hr"));
  const favs = store.get("fav").map(i => chById[i]).filter(Boolean).slice(0, 12);
  if (favs.length) {
    n.append(el("h3", "", "お気に入り"));
    favs.forEach(c => { const a = el("a", r === "#/ch/" + c.id ? "on" : ""); a.href = "#/ch/" + c.id; const i = img(c.avatar, "ava"); i.style.cssText = "width:24px;height:24px"; a.append(i, document.createTextNode(c.name)); n.append(a); });
    n.append(el("hr"));
  }
  n.append(el("h3", "", "カテゴリ"));
  GENRES.forEach(g => n.append(item("▸", g, "#/cat/" + encodeURIComponent(g))));
  n.append(el("hr"), item("🧒", "YouTube Kids をひらく", "https://www.youtubekids.com/", true));
}
function route() {
  const p = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("/");
  document.body.classList.toggle("watching", p[0] === "watch");
  document.body.classList.remove("open");
  if (p[0] !== "q") $("q").value = "";
  if (p[0] === "watch") watch(p[1]);
  else if (p[0] === "ch") channel(p[1]);
  else if (p[0] === "cat") home(p.slice(1).join("/"));
  else if (p[0] === "shorts") shortsPage();
  else if (p[0] === "fav") favPage();
  else if (p[0] === "history") histPage();
  else if (p[0] === "q") searchPage(p.slice(1).join("/"));
  else home();
  nav(); window.scrollTo(0, 0);
}
$("search").onsubmit = e => { e.preventDefault(); const q = $("q").value.trim(); if (q) location.hash = "#/q/" + encodeURIComponent(q); };
$("menu").onclick = () => { const b = document.body; if (b.classList.contains("watching") || innerWidth <= 800) b.classList.toggle("open"); else b.classList.toggle("mini"); };
window.addEventListener("hashchange", route);
// 許可リストと動画データは毎回最新を読み込む
Promise.all([load("channels.js"), load("videos.js")]).then(() => { prepare(); route(); });
</script>
